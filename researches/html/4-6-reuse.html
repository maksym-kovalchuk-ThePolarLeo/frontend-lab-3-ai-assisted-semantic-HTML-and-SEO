<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>4.6 Перевикористання та Рефакторинг</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/reuse-style.css" />
  </head>
  <body>
    <!-- Перша стандартна картка -->
    <div class="card">
      <h3 class="card-title">Базовий план</h3>
      <p class="card-text">Доступ до основних матеріалів курсу з веброзробки.</p>
      <div class="card-actions">
        <div class="card-actions">
          <!-- Використання базового класу + модифікатора -->
          <button class="btn btn-outline">Детальніше</button>
          <button class="btn btn-primary">Придбати</button>
        </div>
      </div>
    </div>

    <!-- Друга картка (демонстрація перевикористання) -->
    <div class="card">
      <h3 class="card-title">Pro План</h3>
      <p class="card-text">Всі матеріали, код-рев'ю та консультації наживо.</p>
      <div class="card-actions">
        <button class="btn btn-primary">Оформити підписку</button>
      </div>
    </div>
  </body>
</html>

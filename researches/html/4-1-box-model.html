<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>4.1 Box Model</title>
    <style>
      .box {
        width: 200px;
        height: 200px;
        padding: 20px;
        border: 10px solid #333;
        margin-bottom: 20px;
        background-color: #e0f7fa;
      }

      .content-box {
        box-sizing: content-box; /* Значення за замовчуванням */
      }

      .border-box {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1>Box Model (ширина обох блоків зазначена як 200px)</h1>
    <h2>box-sizing: content-box</h2>
    <div class="box content-box">Контент</div>

    <h2>box-sizing: border-box</h2>
    <div class="box border-box">Контент</div>
  </body>
</html>
